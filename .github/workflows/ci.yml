name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  web:
    name: Web (tipos, tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rules:
    name: Reglas de Firebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-test/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test

  android:
    name: App Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configuración de Firebase para la app
        env:
          MOBILE_CONFIG_JSON: ${{ secrets.MOBILE_CONFIG_JSON }}
        run: |
          if [ -n "$MOBILE_CONFIG_JSON" ]; then echo "$MOBILE_CONFIG_JSON" > build-config.json
          elif [ -f config.json ]; then cp config.json build-config.json
          else cp config.example.json build-config.json; fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define-from-file=build-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: marcamovil-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    name: App iOS (compilación sin firmar)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-swift-package-manager
      - name: Configuración de Firebase para la app
        env:
          MOBILE_CONFIG_JSON: ${{ secrets.MOBILE_CONFIG_JSON }}
        run: |
          if [ -n "$MOBILE_CONFIG_JSON" ]; then echo "$MOBILE_CONFIG_JSON" > build-config.json
          elif [ -f config.json ]; then cp config.json build-config.json
          else cp config.example.json build-config.json; fi
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define-from-file=build-config.json
