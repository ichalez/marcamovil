name: marcamovil_streamer
description: "Emisión RTMP con cámara y overlay HTML para MarcaMóvil (Android: RootEncoder, iOS: HaishinKit)."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.marcamovil.marcamovil_streamer
        pluginClass: MarcamovilStreamerPlugin
      ios:
        pluginClass: MarcamovilStreamerPlugin
